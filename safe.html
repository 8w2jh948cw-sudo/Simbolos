<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="./tools.css"><title>Modo Seguro · Símbolos</title></head><body><main class="page"><a class="back" href="./menu.html">‹ Menu</a><p class="eyebrow">Oficial · independente do app</p><h1>Modo Seguro</h1><p class="lead">Lê a biblioteca diretamente do localStorage e funciona sem app.js, patches ou Service Worker.</p><div class="panel"><div class="row"><span>Chave</span><code>simbolos.library.v2</code></div><div class="row"><span>Existe</span><strong id="exists">—</strong></div><div class="row"><span>Registros</span><strong id="count">—</strong></div><div class="row"><span>Tamanho</span><strong id="size">—</strong></div><div class="row"><span>IndexedDB disponível</span><strong id="idb">—</strong></div></div><button id="backup" class="button green">Exportar backup JSON</button><pre id="preview">Carregando…</pre></main><script>const KEY='simbolos.library.v2';let raw='';let data=[];try{raw=localStorage.getItem(KEY)||'';data=raw?JSON.parse(raw):[];document.getElementById('exists').textContent=raw?'Sim':'Não';document.getElementById('count').textContent=Array.isArray(data)?data.length:'Formato não reconhecido';document.getElementById('size').textContent=new Blob([raw]).size+' bytes';document.getElementById('preview').textContent=raw?JSON.stringify(data.slice?.(0,3)||data,null,2):'Nenhum dado salvo nesta chave.';}catch(e){document.getElementById('preview').textContent='Erro ao ler: '+e.message;}document.getElementById('idb').textContent=typeof indexedDB!=='undefined'?'Sim':'Não';document.getElementById('backup').onclick=()=>{const payload=JSON.stringify({app:'Simbolos',environment:'official',safeBackup:true,exportedAt:new Date().toISOString(),symbols:Array.isArray(data)?data:[]},null,2),url=URL.createObjectURL(new Blob([payload],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='simbolos-oficial-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};</script></body></html>
