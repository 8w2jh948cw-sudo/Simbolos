<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="./tools.css"><title>Inicializador · Símbolos</title></head><body><main class="page"><a class="back" href="./menu.html">‹ Menu</a><p class="eyebrow">Oficial</p><h1>Inicializador</h1><p class="lead">Verifica o runtime sem deixar manutenção de cache bloquear a abertura do app.</p><div class="panel" id="state"><div class="row"><span>Estado</span><strong id="status">Verificando…</strong></div><div class="row"><span>Dados</span><strong>Não serão alterados</strong></div></div><button class="button green" id="open">Abrir Oficial agora</button><p class="notice">Mesmo que a limpeza de runtime demore, este botão continua disponível.</p></main><script>const status=document.getElementById('status');const timeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r('timeout'),ms))]);async function clean(){try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.allSettled(regs.filter(r=>r.scope.includes('/Simbolos/')).map(r=>r.unregister()));const keys=await caches.keys();await Promise.allSettled(keys.filter(k=>k.startsWith('simbolos-')).map(k=>caches.delete(k)));return'Runtime verificado';}catch{return'Verificação parcial';}}timeout(clean(),1800).then(v=>status.textContent=v==='timeout'?'Limpeza continua em segundo plano':v);document.getElementById('open').onclick=()=>location.href='./';</script></body></html>
