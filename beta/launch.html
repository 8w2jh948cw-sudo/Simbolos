<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tools.css"><title>Inicializador Beta · Símbolos</title></head><body><main class="page"><a class="back" href="../menu.html">‹ Menu</a><p class="eyebrow">BETA</p><h1>Inicializador Beta</h1><p class="lead">Verifica o runtime sem bloquear a abertura da Beta. Os dados Oficiais não são tocados.</p><div class="panel"><div class="row"><span>Estado</span><strong id="status">Verificando…</strong></div><div class="row"><span>Base usada</span><code>simbolos.beta.library.v2</code></div></div><button class="button orange" id="open">Abrir Beta agora</button></main><script>const timeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r('timeout'),ms))]);async function clean(){try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.allSettled(regs.filter(r=>r.scope.includes('/Simbolos/')).map(r=>r.unregister()));const keys=await caches.keys();await Promise.allSettled(keys.filter(k=>k.startsWith('simbolos-')).map(k=>caches.delete(k)));return'Runtime verificado';}catch{return'Verificação parcial';}}timeout(clean(),1800).then(v=>document.getElementById('status').textContent=v==='timeout'?'Limpeza em segundo plano':v);document.getElementById('open').onclick=()=>location.href='./';</script></body></html>
