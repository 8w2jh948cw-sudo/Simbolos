<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tools.css"><title>Recuperar Beta · Símbolos</title></head><body><main class="page"><a class="back" href="../menu.html">‹ Menu</a><p class="eyebrow">BETA</p><h1>Recuperação Beta</h1><p class="lead">Remove somente runtime/cache. Não apaga a base Beta e nunca acessa a base Oficial para exclusão.</p><div class="panel"><div class="row"><span>Símbolos Beta</span><strong id="count">—</strong></div><div class="row"><span>Ação sobre dados</span><strong>Nenhuma</strong></div><div class="row"><span>Runtime</span><strong id="runtime">Aguardando</strong></div></div><button id="recover" class="button orange">Recuperar Beta</button><p class="notice">Para apagar a Beta intencionalmente, use “Dados da Beta” no Menu. Esta página não faz isso.</p></main><script>const timeout=(p,ms)=>Promise.race([Promise.resolve(p),new Promise(r=>setTimeout(()=>r({timedOut:true}),ms))]);try{const d=JSON.parse(localStorage.getItem('simbolos.beta.library.v2')||'[]');document.getElementById('count').textContent=Array.isArray(d)?d.length+' símbolos':'Dados encontrados';}catch{document.getElementById('count').textContent='Erro de leitura';}document.getElementById('recover').onclick=async()=>{let r=0,c=0,partial=false;const out=document.getElementById('runtime');out.textContent='Limpando runtime…';try{const got=await timeout(navigator.serviceWorker?.getRegistrations?.()||Promise.resolve([]),1800);if(got?.timedOut)partial=true;else{const own=(got||[]).filter(x=>x.scope.includes('/Simbolos/'));r=own.length;const u=await timeout(Promise.allSettled(own.map(x=>x.unregister())),1800);if(u?.timedOut)partial=true;}}catch{partial=true;}try{const got=await timeout(caches.keys(),1800);if(got?.timedOut)partial=true;else{const own=(got||[]).filter(x=>x.startsWith('simbolos-'));c=own.length;const d=await timeout(Promise.allSettled(own.map(x=>caches.delete(x))),1800);if(d?.timedOut)partial=true;}}catch{partial=true;}out.textContent=partial?`Recuperação parcial · ${r} SW · ${c} caches`:`Concluído · ${r} SW · ${c} caches`;alert(partial?'A recuperação Beta terminou parcialmente sem bloquear. Dados Beta e Oficial foram preservados.':'Runtime recuperado. Dados Beta e Oficial preservados.');};</script></body></html>
