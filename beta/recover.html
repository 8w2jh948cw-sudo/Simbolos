<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tools.css"><title>Recuperar Beta · Símbolos</title></head><body><main class="page"><a class="back" href="../menu.html">‹ Menu</a><p class="eyebrow">BETA</p><h1>Recuperação Beta</h1><p class="lead">Remove somente runtime/cache. Não apaga a base Beta e nunca acessa a base Oficial para exclusão.</p><div class="panel"><div class="row"><span>Símbolos Beta</span><strong id="count">—</strong></div><div class="row"><span>Ação sobre dados</span><strong>Nenhuma</strong></div><div class="row"><span>Runtime</span><strong id="runtime">Aguardando</strong></div></div><button id="recover" class="button orange">Recuperar Beta</button><p class="notice">Para apagar a Beta intencionalmente, use “Dados da Beta” no Menu. Esta página não faz isso.</p></main><script>try{const d=JSON.parse(localStorage.getItem('simbolos.beta.library.v2')||'[]');document.getElementById('count').textContent=Array.isArray(d)?d.length+' símbolos':'Dados encontrados';}catch{document.getElementById('count').textContent='Erro de leitura';}document.getElementById('recover').onclick=async()=>{let r=0,c=0;const out=document.getElementById('runtime');out.textContent='Limpando runtime…';try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];const own=regs.filter(x=>x.scope.includes('/Simbolos/'));r=own.length;await Promise.allSettled(own.map(x=>x.unregister()));}catch{}try{const keys=await caches.keys();const own=keys.filter(x=>x.startsWith('simbolos-'));c=own.length;await Promise.allSettled(own.map(x=>caches.delete(x)));}catch{}out.textContent=`Concluído · ${r} SW · ${c} caches`;alert('Runtime recuperado. Dados Beta e Oficial preservados.');};</script></body></html>
