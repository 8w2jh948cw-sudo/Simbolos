<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tools.css"><title>Dados da Beta · Símbolos</title></head><body><main class="page"><a class="back" href="../menu.html">‹ Menu</a><p class="eyebrow">BETA</p><h1>Dados da Beta</h1><p class="lead">A Beta usa uma cópia independente. Você decide quando trazer dados do Oficial.</p><div class="panel"><div class="row"><span>Oficial</span><strong id="official">—</strong></div><div class="row"><span>Beta</span><strong id="beta">—</strong></div></div><button id="copy" class="button">Copiar Oficial → Beta</button><button id="clear" class="button red">Limpar somente a Beta</button><p class="notice">Copiar substitui a base Beta atual por uma cópia da Oficial. Nenhuma das ações desta página altera a base Oficial.</p></main><script>const OFF='simbolos.library.v2',BET='simbolos.beta.library.v2',LEG='simbolos.beta.library.v1';function n(k){try{const d=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(d)?d.length:0}catch{return 0}}function draw(){document.getElementById('official').textContent=n(OFF)+' símbolos';document.getElementById('beta').textContent=n(BET)+' símbolos';}document.getElementById('copy').onclick=()=>{if(!confirm('Substituir os dados atuais da Beta por uma cópia do Oficial?'))return;const raw=localStorage.getItem(OFF)||'[]';localStorage.setItem(BET,raw);draw();alert('Dados copiados. A partir daqui as duas bases são independentes.');};document.getElementById('clear').onclick=()=>{if(!confirm('Apagar somente todos os dados da Beta? O Oficial será preservado.'))return;localStorage.removeItem(BET);localStorage.removeItem(LEG);draw();alert('Beta limpa. Biblioteca Oficial preservada.');};draw();</script></body></html>
