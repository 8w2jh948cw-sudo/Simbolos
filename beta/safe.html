<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tools.css"><title>Modo Seguro Beta · Símbolos</title></head><body><main class="page"><a class="back" href="../menu.html">‹ Menu</a><p class="eyebrow">BETA · independente do app</p><h1>Modo Seguro Beta</h1><p class="lead">Lê apenas a base Beta diretamente do localStorage, sem app.js.</p><div class="panel"><div class="row"><span>Chave</span><code>simbolos.beta.library.v2</code></div><div class="row"><span>Existe</span><strong id="exists">—</strong></div><div class="row"><span>Registros</span><strong id="count">—</strong></div><div class="row"><span>Tamanho</span><strong id="size">—</strong></div></div><button id="backup" class="button orange">Exportar backup Beta</button><pre id="preview">Carregando…</pre></main><script>const KEY='simbolos.beta.library.v2';let raw='',data=[];try{raw=localStorage.getItem(KEY)||'';data=raw?JSON.parse(raw):[];document.getElementById('exists').textContent=raw?'Sim':'Não';document.getElementById('count').textContent=Array.isArray(data)?data.length:'Formato não reconhecido';document.getElementById('size').textContent=new Blob([raw]).size+' bytes';document.getElementById('preview').textContent=raw?JSON.stringify(data.slice?.(0,3)||data,null,2):'Nenhum dado Beta salvo.';}catch(e){document.getElementById('preview').textContent='Erro: '+e.message;}document.getElementById('backup').onclick=()=>{const payload=JSON.stringify({app:'Simbolos',environment:'beta',safeBackup:true,exportedAt:new Date().toISOString(),symbols:Array.isArray(data)?data:[]},null,2),url=URL.createObjectURL(new Blob([payload],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='simbolos-beta-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};</script></body></html>
