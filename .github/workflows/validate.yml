name: Validate release
on:
  push:
    branches: [main, gh-pages, stable, development]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-release.mjs
